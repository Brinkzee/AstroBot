<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星光优选 - 智能客服小星</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-gradient: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      --user-bubble: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --avatar-bot: #dbeafe;
      --avatar-user: #e0e7ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    /* 聊天主视窗 */
    .chat-card {
      width: 100%;
      max-width: 900px;
      height: 92vh;
      background: var(--card-bg);
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }

    /* 顶栏 Header */
    .chat-header {
      padding: 16px 24px;
      background: #ffffff;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 10;
    }

    .bot-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar-wrapper {
      position: relative;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--avatar-bot);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      user-select: none;
    }

    .online-indicator {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 11px;
      height: 11px;
      background: #22c55e;
      border: 2px solid #ffffff;
      border-radius: 50%;
    }

    .title-area h1 {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge {
      font-size: 11px;
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .status-text {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .session-badge {
      font-size: 12px;
      color: var(--text-muted);
      background: #f8fafc;
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-family: monospace;
    }

    .btn-reset {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-reset:hover {
      background: #f1f5f9;
      color: #ef4444;
      border-color: #fca5a5;
    }

    /* 消息流区域 */
    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      scroll-behavior: smooth;
    }

    /* 气泡组件 */
    .msg-row {
      display: flex;
      gap: 12px;
      max-width: 85%;
      animation: fadeIn 0.25s ease-out forwards;
    }

    .msg-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-row.bot {
      align-self: flex-start;
    }

    .msg-content {
      padding: 12px 18px;
      border-radius: 16px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .msg-row.user .msg-content {
      background: var(--user-bubble);
      color: #ffffff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .msg-row.bot .msg-content {
      background: #f8fafc;
      color: var(--text-main);
      border: 1px solid #e2e8f0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      min-width: 160px;
    }

    /* 工具轨迹徽章 Tool Badges */
    .tool-badge-container {
      margin-bottom: 10px;
    }

    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .tool-badge.loading {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      animation: pulseGlow 1.5s infinite alternate;
    }

    .tool-badge.completed {
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }

    .tool-badge.failed {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .tool-spinner {
      width: 12px;
      height: 12px;
      border: 2px solid #bfdbfe;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulseGlow {
      from { box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.2); }
      to { box-shadow: 0 0 8px 2px rgba(59, 130, 246, 0.3); }
    }

    /* 打字机光标效果 */
    .typing-cursor {
      display: inline-block;
      width: 2px;
      height: 15px;
      vertical-align: -2px;
      background: var(--primary);
      margin-left: 3px;
      animation: blink 0.8s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 思考中小圆点动画 */
    .typing-indicator {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
    }

    .typing-indicator span {
      width: 6px;
      height: 6px;
      background: #94a3b8;
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }

    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    /* 快捷提问胶囊 */
    .quick-chips-container {
      padding: 8px 24px 0;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .quick-chips-container::-webkit-scrollbar { display: none; }

    .chip-btn {
      background: #f1f5f9;
      color: #334155;
      font-size: 12.5px;
      padding: 6px 12px;
      border-radius: 14px;
      border: 1px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .chip-btn:hover {
      background: #e2e8f0;
      border-color: #cbd5e1;
      color: var(--primary);
    }

    .chip-btn.highlight {
      background: #e0f2fe;
      border-color: #bae6fd;
      color: #0284c7;
      font-weight: 500;
    }

    /* 底部输入框 */
    .chat-footer {
      padding: 16px 24px 20px;
      background: #ffffff;
      border-top: 1px solid var(--border-color);
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: #f8fafc;
      border: 1.5px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-wrapper:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      background: #ffffff;
    }

    textarea#user-input {
      flex: 1;
      border: none;
      background: transparent;
      outline: none;
      font-size: 14.5px;
      line-height: 1.5;
      max-height: 120px;
      resize: none;
      color: var(--text-main);
      font-family: inherit;
    }

    button#btn-send {
      background: var(--primary-gradient);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      flex-shrink: 0;
    }

    button#btn-send:hover:not(:disabled) {
      transform: translateY(-1px);
    }

    button#btn-send:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .footer-tip {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 8px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <!-- 头部信息 -->
    <header class="chat-header">
      <div class="bot-info">
        <div class="avatar-wrapper">
          <div class="avatar">🌟</div>
          <div class="online-indicator"></div>
        </div>
        <div class="title-area">
          <h1>智能客服小星 <span class="badge">Function Calling 赋能</span></h1>
          <div class="status-text">支持自主工具调用 · 实时状态帧与逐 Token 流式推送</div>
        </div>
      </div>
      <div class="header-actions">
        <div class="session-badge" id="session-display">会话: 自动生成</div>
        <button class="btn-reset" id="btn-clear" title="开启全新会话">新建对话</button>
      </div>
    </header>

    <!-- 消息滚动流 -->
    <main class="chat-messages" id="messages-container">
      <!-- 欢迎卡片 -->
      <div class="msg-row bot">
        <div class="avatar" style="width:36px; height:36px; font-size:18px;">🌟</div>
        <div class="msg-content">
          您好！我是星光优选智能客服<strong>小星</strong>。我已经具备自主业务工具查询能力！
          您可以随时咨询：
          • 查物流：「订单 1001 的物流到哪了」
          • 查常见问答：「退货政策是什么」
          • 查订单/商品：「查询商品羽绒服」
          • 转人工工单：「帮我创建售后工单」
        </div>
      </div>
    </main>

    <!-- 快捷提问胶囊 -->
    <div class="quick-chips-container">
      <button class="chip-btn highlight" onclick="sendQuickText('订单 1001 的物流到哪了')">🚚 验收1: 查物流到哪了</button>
      <button class="chip-btn highlight" onclick="sendQuickText('退货政策是什么')">📋 验收2: 查退货政策</button>
      <button class="chip-btn highlight" onclick="sendQuickText('邮费是多少')">🔍 验收3: 邮费是多少(漏召回)</button>
      <button class="chip-btn" onclick="sendQuickText('查询订单 1001 的信息')">📦 查订单1001</button>
      <button class="chip-btn" onclick="sendQuickText('帮我创建售后工单，手机收到后外壳有划痕')">🎫 创建售后工单</button>
    </div>

    <!-- 底部输入栏 -->
    <footer class="chat-footer">
      <div class="input-wrapper">
        <textarea id="user-input" rows="1" placeholder="输入您的问题... (按 Enter 发送，Shift+Enter 换行)"></textarea>
        <button id="btn-send" title="发送提问">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
      <div class="footer-tip">由 FastAPI + SQLAlchemy Async + LangChain @tool 驱动 · 单轮精准收敛</div>
    </footer>
  </div>

  <script>
    let currentConversationId = null;
    let isStreaming = false;

    const messagesContainer = document.getElementById('messages-container');
    const userInput = document.getElementById('user-input');
    const btnSend = document.getElementById('btn-send');
    const sessionDisplay = document.getElementById('session-display');
    const btnClear = document.getElementById('btn-clear');

    // 自动调整输入框高度
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 120) + 'px';
    });

    // Enter 发送，Shift+Enter 换行
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    btnSend.addEventListener('click', sendMessage);

    btnClear.addEventListener('click', () => {
      currentConversationId = null;
      sessionDisplay.innerText = '会话: 自动生成';
      messagesContainer.innerHTML = `
        <div class="msg-row bot">
          <div class="avatar" style="width:36px; height:36px; font-size:18px;">🌟</div>
          <div class="msg-content">
            已开启全新会话！我是星光优选客服<strong>小星</strong>，请问有什么可以帮您？
          </div>
        </div>
      `;
      userInput.focus();
    });

    function sendQuickText(text) {
      if (isStreaming) return;
      userInput.value = text;
      sendMessage();
    }

    function scrollToBottom() {
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function appendUserMessage(text) {
      const row = document.createElement('div');
      row.className = 'msg-row user';
      row.innerHTML = `<div class="msg-content">${escapeHtml(text)}</div>`;
      messagesContainer.appendChild(row);
      scrollToBottom();
    }

    function createBotPlaceholder() {
      const row = document.createElement('div');
      row.className = 'msg-row bot';

      const avatar = document.createElement('div');
      avatar.className = 'avatar';
      avatar.style.cssText = 'width:36px; height:36px; font-size:18px;';
      avatar.innerText = '🌟';

      const content = document.createElement('div');
      content.className = 'msg-content';
      content.innerHTML = `
        <div class="tool-badge-container" style="display:none;"></div>
        <div class="text-body">
          <span class="typing-indicator">
            <span></span><span></span><span></span>
          </span>
        </div>
      `;

      row.appendChild(avatar);
      row.appendChild(content);
      messagesContainer.appendChild(row);
      scrollToBottom();
      return content;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isStreaming) return;

      appendUserMessage(text);
      userInput.value = '';
      userInput.style.height = 'auto';

      isStreaming = true;
      btnSend.disabled = true;

      const botContentEl = createBotPlaceholder();
      const toolContainer = botContentEl.querySelector('.tool-badge-container');
      const textBody = botContentEl.querySelector('.text-body');

      let fullText = '';
      let hasReceivedFirstToken = false;

      try {
        const payload = {
          message: text
        };
        if (currentConversationId) {
          payload.conversation_id = currentConversationId;
        }

        const response = await fetch('/api/chat/stream', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error('网络请求异常: ' + response.statusText);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder('utf-8');
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const parts = buffer.split('\n\n');
          buffer = parts.pop(); // 保留未闭合块

          for (const part of parts) {
            const trimmed = part.trim();
            if (!trimmed || !trimmed.startsWith('data:')) continue;

            const dataStr = trimmed.replace(/^data:\s*/, '');
            if (dataStr === '[DONE]') {
              break;
            }

            try {
              const data = JSON.parse(dataStr);

              // 记录会话 ID
              if (data.conversation_id) {
                currentConversationId = data.conversation_id;
                sessionDisplay.innerText = '会话: #' + currentConversationId;
              }

              // 事件分流处理
              if (data.event_type === 'tool_start') {
                toolContainer.style.display = 'block';
                const label = data.tool_label || data.tool_name;
                toolContainer.innerHTML = `
                  <div class="tool-badge loading">
                    <div class="tool-spinner"></div>
                    <span>⚡ 正在调用工具: <strong>${escapeHtml(label)}</strong> (${escapeHtml(data.tool_name)}) ...</span>
                  </div>
                `;
                scrollToBottom();
              } else if (data.event_type === 'tool_end') {
                toolContainer.style.display = 'block';
                const statusIcon = data.success ? '📦' : '⚠️';
                const statusText = data.success ? '调用成功' : '调用异常';
                const badgeClass = data.success ? 'completed' : 'failed';
                toolContainer.innerHTML = `
                  <div class="tool-badge ${badgeClass}">
                    <span>${statusIcon} 已调用工具: <strong>${escapeHtml(data.tool_name)}</strong></span>
                    <span style="opacity:0.8; font-size:11px;">[${statusText}]</span>
                  </div>
                `;
                scrollToBottom();
              } else if (data.event_type === 'text' || (!data.event_type && data.content)) {
                const chunk = data.content || '';
                if (chunk) {
                  if (!hasReceivedFirstToken) {
                    hasReceivedFirstToken = true;
                    textBody.innerHTML = ''; // 移除 loading 三个点
                  }
                  fullText += chunk;
                  textBody.innerHTML = escapeHtml(fullText) + '<span class="typing-cursor"></span>';
                  scrollToBottom();
                }
              } else if (data.event_type === 'error' || data.error) {
                const errMsg = data.error || '未知异常';
                textBody.innerHTML = `<span style="color:#ef4444;">出错了: ${escapeHtml(errMsg)}</span>`;
                scrollToBottom();
              }
            } catch (err) {
              console.warn('解析 SSE 帧失败:', err, dataStr);
            }
          }
        }

        // 流结束，移除光标
        if (textBody) {
          textBody.innerHTML = escapeHtml(fullText || (hasReceivedFirstToken ? '' : '抱歉，未能获取有效回复。'));
        }
        scrollToBottom();

      } catch (err) {
        textBody.innerHTML = `<span style="color:#ef4444;">请求失败: ${escapeHtml(err.message)}</span>`;
      } finally {
        isStreaming = false;
        btnSend.disabled = false;
        userInput.focus();
      }
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
