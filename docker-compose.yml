services:
  mysql:
    image: mysql:8.0
    container_name: astro_bot_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: astro_bot
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - ./sql/ch02-ddl.sql:/docker-entrypoint-initdb.d/ch02-ddl.sql
